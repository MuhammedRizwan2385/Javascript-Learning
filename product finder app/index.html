function searchID() {

    let searchID = document.getElementById('ID').value.trim();

    const cardContainer = document.getElementById('result');

    // Check empty input
    if (searchID == "") {
        cardContainer.innerHTML = `<h4 class="text-danger">Please enter Product ID</h4>`;
        return;
    }

    // Create XMLHttpRequest object
    const response = new XMLHttpRequest();

    // API calling
    response.open("GET", `https://dummyjson.com/products/${searchID}`);

    // Send request
    response.send();

    // Check response
    response.onreadystatechange = () => {

        if (response.readyState == 4) {

            if (response.status == 200) {

                let productData = JSON.parse(response.responseText);

                displayProduct(productData);

            }
            else {
                cardContainer.innerHTML =
                    `<h3 class="text-danger text-center">Product not found</h3>`;
            }
        }
    };

    response.onerror = () => {
        cardContainer.innerHTML =
            `<h3 class="text-danger">Network error. Try again.</h3>`;
    };
}


function displayProduct(details) {

    const cardContainer = document.getElementById('result');

    const cardHtml = `
        <div class="card d-flex flex-column p-3 shadow-lg">

            <div class="text-center">
                <img src="${details.thumbnail}" 
                     width="200" height="200"
                     class="img-fluid">
            </div>

            <h2 class="card-title text-center fw-bold">
                ${details.title}
            </h2>

            <p class="text-center">Price: $${details.price}</p>

            <p class="text-center">Category: ${details.category}</p>

            <p class="text-center">Rating: ${details.rating}</p>

            <p class="text-center">${details.description}</p>

        </div>
    `;

    cardContainer.innerHTML = cardHtml;
}
