<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

      <!-- boostrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
       <!-- boostrap script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
    <div class="d-flex flex-column justify-content-center align-items-center m-5">
        <h1 class="text-center text-primary mb-3">Random user Selector</h1>
        <button class="btn btn-success border rounded-lg shadow-lg" onclick="randomUser()">Pick a Random User</button>
    </div>
    <div class="d-flex flex-column justify-content-center align-items-center" id="result">

    </div>
</body>

<script>
   
function randomUser(){
    fetch('https://dummyjson.com/users').then(items=>items.json()).then(items=>displayUser(items));
}
function displayUser(items){
    // console.log(items);
    let randomUserId=Math.floor(Math.random()*30)+1;
    // console.log(randomUserId);

    let randomUser=items.users.find(items=>items.id==randomUserId);

    console.log(randomUser);

    let userCardHtml=
    `
    <div class="col-md-4 ">
        <div class="card d-flex flex-column justify-content-center align-items-center border border-3 shadow-lg rounded-4">
            <div class="card-body ">
                <table>
                    <tr>
                        <td><span class="fw-bolder me-3">User ID : </span></td>
                        <td>${randomUser.id}</td>
                    </tr>
                    
                    <tr>
                        <td><span class="fw-bolder me-3">First Name : </span></td>
                        <td>${randomUser.firstName}</td>
                    </tr>
                    <tr>
                        <td><span class="fw-bolder me-3">Last Name : </span></td>
                        <td>${randomUser.lastName}}</td>
                    </tr>
                    <tr>
                        <td><span class="fw-bolder me-3">Age : </span></td>
                        <td>${randomUser.age}</td>
                    </tr>
                    <tr>
                        <td><span class="fw-bolder me-3">Email : </span></td>
                        <td>${randomUser.email}</td>
                    </tr>
                    <tr>
                        <td><span class="fw-bolder me-3">Phone : </span></td>
                        <td>${randomUser.phone}</td>
                    </tr>
                    <tr>
                        <td><span class="fw-bolder me-3">Profile Image :</span></td>
                        <td> <img src=${randomUser.image} </td>
                    </tr>

                </table>


            </div>
        </div>
    </div>
    `
    document.getElementById('result').innerHTML=userCardHtml;

}


</script>
</html>
