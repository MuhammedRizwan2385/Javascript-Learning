<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

     <!-- boostrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
       <!-- boostrap script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- boostrap icon -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <!-- external css -->

    <link rel="stylesheet" type="text/css" href="./home.css">

</head>
<body>
    
<div class="container maindashboard">

 <div class="row mt-3">
            <div class="col-6">
                
                <h1 id="head1" class="text-primary fw-bolder"><i class="bi bi-person-fill"></i>Welcome user</h1>
        
            </div>
            <div class="col-6 d-flex justify-content-end">
                <button onclick="logout()" class="btn btn-danger">Logout</button>
            </div>

    </div>

    <div class="heading p-5 ">
        <h1 class="text-center ">Smart Wallet</h1><hr>
        
    </div>
    <div class="row justify-content-center g-4">

        <div class="col-12 col-md-6  text-center">
            <div class="income-box p-4 rounded-4 shadow-sm mb-4 text-center">
                <h1 class="py-3 pb-5 text-secondary mb-2">Total Balance</h1>
                <h2 class="display-6 py-3 pb-5 fw-bold text-primary" id="balance">Rs 0/-</h2>
            </div> 
            <div class="income-form p-4 border rounded-4 bg-white shadow-sm">
                <h1 class="h4 fw-bold mb-3">Add Income</h1><hr>
                <input type="text" id="incometype" placeholder="Enter Income Type" class="form-control fw-bolder mb-3">
                <input type="Number" id="incomeamount" placeholder="Enter Amount" class="form-control fw-bolder">
                <button class="btn btn-success px-5 mt-3 " type="button" onclick="income()">Add Income</button>
            </div>  
        </div>
         <div class="col-12 col-md-6 text-center">
            <div class="expense-box p-4 rounded-4 shadow-sm mb-4 text-center">
                <h1 class="py-3 pb-5 text-secondary">Total Expense</h1>
                <h2 class="py-3 pb-5 display-6 fw-bold text-danger mb-0" id="expense">Rs 0/-</h2>
            </div>  
            <div class="expense-form p-4 border rounded-4 bg-white shadow-sm">
                <h1 class="h4 fw-bold mb-3">Add Expense</h1><hr>
                <input type="text" placeholder="Enter Expense Type" id="expensetype" class="form-control fw-bolder mb-3">
                <input type="Number" placeholder="Enter Amount" id="expenseamount" class="form-control fw-bolder">
                <button class="btn btn-danger px-5 mt-3 " type="button" onclick="expense()">Add Expense</button>
            </div>  
        </div>
        <div class="text-center my-4">
            <button class="btn btn-warning fw-bold px-4" type="button" onclick="clearData()">
                Clear All <i class="bi bi-eraser-fill me-2"></i>
            </button>
        </div>
    </div>


 <div class="heading p-5 ">
        <h1 class="text-center ">Income and Expense Details</h1><hr>
        
    </div>

<div class="row justify-content-center g-4">
      
     <div class="col-12 col-md-6  text-center">
        <h1>Income</h1>
        <div class="table-responsive">
            <table class="table mx-auto">
                <thead class="fw-medium fs-5 table-warning">
                    <tr style="border-bottom: pink 5px solid; ">
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Balance</th>
                        <th>Date & Time </th>
                    </tr>
                </thead>
                <tbody class="fw-medium " id="incomedetails">

                </tbody>
            </table>
        </div>
     </div>

     <div class="col-12 col-md-6  text-center">
        <h1>Expense</h1>
        <div class="table-responsive">
            <table class="table mx-auto ">
            <thead class="fw-medium fs-5 table-warning">
                <tr style="border-bottom: pink 5px solid; ">
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Balance</th>
                    <th>Date & Time </th>
                </tr>
            </thead>
            <tbody class="fw-medium " id="expensedetails">

            </tbody>
        </table>
        </div>
     </div>
</div>
</div>




</body>
<script src="./script.js"></script>
</html>
