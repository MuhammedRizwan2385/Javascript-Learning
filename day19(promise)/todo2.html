<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

      <!-- boostrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
       <!-- boostrap script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
    <h1>TODO LIST</h1>
    <table class="border border-4 border-dark">
        <thead>
            <tr>
                <th class="border border-4 border-dark">userId</th>
                <th class="border border-4 border-dark">Id</th>
                <th class="border border-4 border-dark">Title</th>
                <th class="border border-4 border-dark">completed</th>
            </tr>
        </thead>
            <tbody id="result">

            </tbody>
    </table>
</body>

<script>

// 1.fetch()- Asynchronous event- response ->.then

fetch('https://jsonplaceholder.typicode.com/todos').then(item=>item.json()).then(todos=>displayData(todos))

// 2. display content in html

function displayData(todos){
    for(let todo of todos){
        console.log(todo);

        htmlData=`
        <tr>
            <td class="border">${todo.userId}</td>
            <td class="border">${todo.id}</td>
            <td class="border">${todo.title}</td>
            <td class="border">${todo.completed}</td>
        </tr>
        `
        result.innerHTML+=htmlData
    }
}

</script>
</html>
