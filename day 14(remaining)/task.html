<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
       <!-- boostrap script -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="bg-info">
   <div class="row">
    <div class="col-4"></div>
    <div class="col-4 border border-2 border-dark m-5 bg-light rounded shadow w-25">
        <h1 class="text-center p-3 m-4">Age Checker </h1>
        <input id="ageValue" type="text" class="form-control my-3">
        <div class="text-center">
            <button onclick="ageChecker()" class="btn btn-primary m-3">check</button>
            <p id="result"></p>
        </div>
    </div>
    <div class="col-4"></div>
    </div>
   


    <script>
        function ageChecker(){
            const age=document.getElementById("ageValue").value;
            const result=document.getElementById("result");
            // console.log(age);
            if(age.trim()===""){
                result.textContent="Please Enter Your Age";
                result.className="fw-bolder text-warning";
                return;
            }
            if(age>=18){

                result.textContent="You are eligible to drive";
                result.className="fw-bolder text-success";
                
                
            }
            else{
                result.textContent="you are not eligible to drive";
                result.className="fw-bolder text-danger";

            }
        }
    </script>

</body>
</html>
