<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Tracker</title>

    
        <!-- boostrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
       <!-- boostrap script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    
</head>
<body class="bg-light">
    <h1 class="text-center fw-bold">Movie Watchlist Tracker</h1>
    <div class="container d-flex flex-column justify-content-center border rounded-3 shadow-lg mt-5 p-5">

        <label class="form-label" for="name">Movie Name</label>
        <input type="text" class="form-control" id="movie-name">
        <label class="form-label" for="genre">Genre</label>
        <input type="text" class="form-control" id="movie-genre">
        <label class="form-label" for="year">Release Year</label>
        <input type="text" class="form-control" id="movie-year">
        <label class="form-label" for="rating">Rating</label>
        <input type="text" class="form-control" id="movie-rating">
        <button class="btn btn-success rounded-3 shadow-lg mt-5" onclick="add()">Add</button>
    </div>

    <div class="container d-flex flex-column justify-content-center border  rounded-3 shadow-lg mt-5 p-5">
        <table class="border border-3 border-black m-3 text-center">
            <thead>
                <th class="border border-3 border-black text-center">Movie Name</th>
                <th class="border border-3 border-black text-center">Movie Genre</th>
                <th class="border border-3 border-black text-center">Movie Release Year</th>
                <th class="border border-3 border-black text-center">Movie Rating</th>
                <th class="border border-3 border-black text-center">Watch Status</th>

                <th class="border border-3 border-black text-center">Action</th>
            </thead>
            <tbody id="result">

            </tbody>
        </table>
    </div>


</body>
<script src="./script.js"></script>
</html>
