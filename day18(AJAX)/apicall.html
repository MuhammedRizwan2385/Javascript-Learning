<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

      <!-- boostrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
       <!-- boostrap script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
    
    <h1 class="text-primary text-center">ToDo Data</h1>
    <div class="row">
        <div class="col-4"></div>
        <div class="col-4">
            <center>
                <table class="border border-3 border-primary">
                    <thead>
                        <tr>
                            <th class="border border-3 border-primary">userId</th>
                            <th class="border border-3 border-primary">Id</th>
                            <th class="border border-3 border-primary">Title</th>
                            <th class="border border-3 border-primary">completed</th>
                        </tr>
                    </thead>
                    <tbody id="result">

                    </tbody>
                </table>
            </center>
        </div>
        <div class="col-4"></div>
    </div>

</body>

<script>
 
//  AJAX API CALL

// 1. create a new XMLHTTPRequest object

const response=new XMLHttpRequest();
   
// 2. connect to API Call

response.open('get','https://jsonplaceholder.typicode.com/todos');

// 3. send req

response.send();

// 4. set OnreadystateChange

response.onreadystatechange=()=>{
    if(response.readyState==4){
        if(response.status==200){
            // console.log(response.responseText);

            let todoArray=JSON.parse(response.responseText);

            // console.log(todoArray);

            displayData(todoArray);
        }
    }
}


// 5. Display array of data into the browser

function displayData(todoArray){

    for(let todo of todoArray){
        // console.log(todo);

        // using html in script only works if we give boostrap link cdn
        
        htmlData=`
        <tr>
        <td class=border border-3 border-primary> ${todo.userId}</td>
        <td class=border border-3 border-primary> ${todo.id}</td>
        <td class=border border-3 border-primary> ${todo.title}</td>
        <td class=border border-3 border-primary> ${todo.completed}</td>
        </tr>
        `
        result.innerHTML+=htmlData


    }

}


</script>
</html>
