<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

     <!-- external css -->
    <link rel="stylesheet" type="text/css" href="./style.css">
    <!-- boostrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
       <!-- boostrap script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
    <div class="calc-body">
        <div class="calc-screen">
            <div class="calc-typed">
                <input id="result" type="text" class="form-control text" placeholder="0">
            </div>
        </div>
        <div class="calc-button-row">
            <button id="seven" onclick="displayNumber(7)">7</button>
            <button id="eigth" onclick="displayNumber(8)">8</button>
            <button id="nine" onclick="displayNumber(9)">9</button>
            <button id="mul" onclick="displayNumber('*')" class="opt">&#215;</button> 

            <button id="four" onclick="displayNumber(4)">4</button>
            <button id="five" onclick="displayNumber(5)">5</button>
            <button id="six" onclick="displayNumber(6)">6</button>
            <button id="sub" onclick="displayNumber('-')" class="opt">&#8722;</button> 

            <button id="one" onclick="displayNumber(1)">1</button>
            <button id="two" onclick="displayNumber(2)">2</button>
            <button id="three" onclick="displayNumber(3)">3</button>
            <button id="add" onclick="displayNumber('+')" class="opt">&#43;</button> 

            <button id="doubleZero" onclick="displayNumber('00')"class="opt">00</button>
            
            
            <button id="singleZero" onclick="displayNumber(0)"class="opt">0</button>

            
            <button id="point" onclick="displayNumber('.')"class="opt">.</button>

            
            <button id="div" onclick="displayNumber('/')"class="opt">&#247;</button>

            
            <button id="ac" class="ac" onclick="clearBox()">AC</button>

            
            <button id="del" onclick="removeLastItem()">&#9003;</button>

             <button id="equal" onclick="evaluateExp()" class="opt1">&#61;</button>






        </div>
    </div>

   




</body>

<script src="./script.js"></script>
</html>
